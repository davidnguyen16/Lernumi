name: lernumi

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: lernumi
      POSTGRES_USER: lernumi
      POSTGRES_PASSWORD: lernumi_dev
    ports:
      - "127.0.0.1:${LERNUMI_DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/docker/postgres/init-testing.sql:/docker-entrypoint-initdb.d/10-testing.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lernumi -d lernumi"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./server
    working_dir: /var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: lernumi
      DB_USERNAME: lernumi
      DB_PASSWORD: lernumi_dev
    ports:
      - "127.0.0.1:${LERNUMI_API_PORT:-8000}:8000"
    volumes:
      - ./server:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
    # Keep Compose's database environment in Laravel's PHP server subprocess.
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000", "--no-reload"]

volumes:
  postgres_data:
