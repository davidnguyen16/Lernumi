name: lernumi-prod

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=16MB
      - -c
      - max_connections=10
      - -c
      - work_mem=1MB
      - -c
      - maintenance_work_mem=16MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: local

  api:
    image: lernumi-api:prod-local
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file: .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      SESSION_DRIVER: database
      SESSION_COOKIE: lernumi_prod_session
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
    volumes:
      - app_storage:/var/www/html/storage/app
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: local

  nginx:
    image: lernumi-nginx:prod-local
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "127.0.0.1:8081:8081"
    volumes:
      - acme_webroot:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_started
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/up"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: local

  certbot:
    image: certbot/certbot:v5.9.0
    profiles: [maintenance]
    volumes:
      - acme_webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

volumes:
  postgres_data:
  app_storage:
  acme_webroot:
  letsencrypt:
