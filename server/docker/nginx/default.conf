server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    return 404;
}

# Serve ACME verification files directly, including on the isolated tool hostname.
# Public application traffic will be enabled after the TLS certificate is issued.
server {
    listen 80;
    server_name lernumi-api.mywire.org lernumi-api.remotewire.net lernumi-tools.mywire.org;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}

# This listener is published only on the host loopback address for diagnostics.
server {
    listen 8081 default_server;
    server_name localhost 127.0.0.1;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    server_tokens off;
    client_max_body_size 32m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param HTTP_PROXY "";

        fastcgi_pass api:9000;
    }

    location ~* \.php(?:/|$) {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
